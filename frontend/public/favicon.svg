<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#0f172a"/>
  <!-- dish -->
  <ellipse cx="50" cy="62" rx="28" ry="10" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M50 52 L50 42" stroke="#64748b" stroke-width="3"/>
  <circle cx="50" cy="38" r="4" fill="#38bdf8"/>
  <!-- signal arcs -->
  <path d="M28 38 A22 22 0 0 1 72 38" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M18 30 A32 32 0 0 1 82 30" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </path>
  <path d="M10 22 A40 40 0 0 1 90 22" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </path>
  <!-- anomaly dot -->
  <circle cx="76" cy="24" r="4" fill="#ef4444">
    <animate attributeName="r" values="4;5;4" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
